<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sartisfação TCG Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center py-10 font-sans">

    <!-- Cabeçalho -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-yellow-400 mb-2">Sartisfação TCG Database</h1>
        <p class="text-slate-400 text-sm">Motor Global de Busca (Multiverso)</p>
    </div>

    <!-- Barra de Busca -->
    <div class="flex gap-4 mb-6">
        <input type="text" id="inputBusca" value="Blastoise" 
               class="px-4 py-2 rounded bg-slate-800 border border-slate-700 text-white w-64 focus:outline-none focus:border-blue-500"
               placeholder="Ex: Charizard, Blastoise...">
        <button id="btnBuscar" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded transition-colors">
            Buscar Multiverso
        </button>
    </div>

    <p id="mensagemErro" class="text-red-500 font-bold mb-4 h-6 text-sm"></p>

    <!-- O Cofre da Carta -->
    <div id="containerCarta" class="hidden bg-slate-800 rounded-xl p-6 flex flex-col md:flex-row gap-8 max-w-3xl w-full border border-slate-700 shadow-2xl mt-4 relative">
        
        <!-- Lado Esquerdo: Imagem -->
        <div class="flex-shrink-0 flex justify-center">
            <img id="imagemCarta" src="" alt="Arte da Carta" class="w-64 md:w-72 rounded-lg shadow-lg" referrerpolicy="no-referrer">
        </div>
        
        <!-- Lado Direito: Informações -->
        <div class="flex flex-col justify-center w-full">
            <div class="mb-4 border-b border-slate-700 pb-4">
                
                <div class="flex justify-between items-start">
                    <span id="colecaoCarta" class="text-xs font-bold text-blue-400 uppercase tracking-widest"></span>
                    
                    <!-- SELETOR DE IDIOMAS (As Bandeiras) -->
                    <div id="seletorIdiomas" class="flex gap-2">
                        <!-- Os botões serão injetados aqui pelo JavaScript -->
                    </div>
                </div>

                <h2 id="nomeCarta" class="text-4xl font-extrabold text-white mt-1"></h2>
                
                <div class="flex gap-4 text-xs text-slate-400 mt-2">
                    <p>ID Oficial: <span id="idOficial" class="text-slate-200"></span></p>
                    <p>Raridade: <span id="raridadeCarta" class="text-slate-200"></span></p>
                </div>
            </div>
            
            <div class="bg-slate-900 rounded-lg p-4 border border-slate-700">
                <h3 class="text-yellow-400 font-bold text-sm mb-2 uppercase">Ataques e Habilidades</h3>
                <p id="descricaoCarta" class="text-slate-300 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const btnBuscar = document.getElementById('btnBuscar');
        const inputBusca = document.getElementById('inputBusca');
        const mensagemErro = document.getElementById('mensagemErro');
        const containerCarta = document.getElementById('containerCarta');

        const imagemCarta = document.getElementById('imagemCarta');
        const colecaoCarta = document.getElementById('colecaoCarta');
        const nomeCarta = document.getElementById('nomeCarta');
        const idOficial = document.getElementById('idOficial');
        const raridadeCarta = document.getElementById('raridadeCarta');
        const descricaoCarta = document.getElementById('descricaoCarta');
        const seletorIdiomas = document.getElementById('seletorIdiomas');

        // NOVA DIV PARA O SELETOR DE VERSÕES (Adicione isto no HTML, logo ACIMA da Div do seletorIdiomas, ou deixamos o JS criar o visual!)
        
        let listaCartasMultiverso = [];
        let cartaAtual = null;

        // Dicionário de Bandeiras do Multiverso Completo
        const bandeiras = {
            'EN': '🇺🇸', 'PT': '🇧🇷', 'ES': '🇪🇸', 'JA': '🇯🇵', 
            'FR': '🇫🇷', 'IT': '🇮🇹', 'DE': '🇩🇪', 'KO': '🇰🇷', 
            'ZH-TW': '🇹🇼', 'ZH-CN': '🇨🇳', 'TH': '🇹🇭', 'ID': '🇮🇩', 
            'NL': '🇳🇱', 'PL': '🇵🇱', 'RU': '🇷🇺'
        };

        // 1. Função para trocar de Idioma
        function renderizarIdioma(siglaIdioma) {
            if (!cartaAtual || !cartaAtual.traducoes) return;

            let traducao = cartaAtual.traducoes.find(t => t.language.toUpperCase() === siglaIdioma.toUpperCase());
            if (!traducao) traducao = cartaAtual.traducoes[0];

            nomeCarta.innerText = traducao.nome;
            descricaoCarta.innerText = traducao.descricao;
            if (traducao.url_imagem) imagemCarta.src = traducao.url_imagem;

            Array.from(seletorIdiomas.children).forEach(btn => {
                if (btn.innerText.includes(siglaIdioma)) {
                    btn.className = 'px-2 py-1 text-xs bg-blue-600 text-white rounded border border-blue-400 opacity-100 transition shadow-[0_0_8px_rgba(37,99,235,0.8)]';
                } else {
                    btn.className = 'px-2 py-1 text-xs bg-slate-700 text-slate-300 rounded border border-slate-600 opacity-50 hover:opacity-100 transition cursor-pointer';
                }
            });
        }

        // 2. NOVA FUNÇÃO: Trocar de Versão (Coleção)
        function selecionarVersaoCarta(index) {
            cartaAtual = listaCartasMultiverso[index];

            // Atualiza os dados estáticos da nova versão
            colecaoCarta.innerText = cartaAtual.colecao;
            idOficial.innerText = cartaAtual.id_oficial;
            raridadeCarta.innerText = cartaAtual.raridade;

            // Refaz os botões de idiomas para esta versão específica
            seletorIdiomas.innerHTML = '';
            cartaAtual.traducoes.forEach(trad => {
                const sigla = trad.language.toUpperCase();
                const emoji = bandeiras[sigla] || '🌐';
                const btn = document.createElement('button');
                btn.innerText = `${emoji} ${sigla}`;
                btn.onclick = () => renderizarIdioma(sigla);
                seletorIdiomas.appendChild(btn);
            });

            // Força o idioma padrão (Inglês ou o primeiro que tiver)
            const idiomaPadrao = cartaAtual.traducoes.some(t => t.language === 'EN') ? 'EN' : cartaAtual.traducoes[0].language;
            renderizarIdioma(idiomaPadrao);

            // Destaca o botão da versão selecionada (Se houver a barra de versões que criamos dinamicamente abaixo)
            const seletorVersoes = document.getElementById('areaVersoes');
            if(seletorVersoes) {
                Array.from(seletorVersoes.children).forEach((btn, i) => {
                    btn.className = i === index 
                        ? 'px-3 py-1 bg-yellow-500 text-slate-900 font-bold rounded text-xs'
                        : 'px-3 py-1 bg-slate-700 text-white rounded hover:bg-slate-600 transition text-xs';
                });
            }
        }

        async function acionarBusca() {
            const nomePokemon = inputBusca.value.trim();
            if (!nomePokemon) return;

            mensagemErro.innerText = 'Consultando o Multiverso...';
            mensagemErro.className = 'text-yellow-400 font-bold mb-4 h-6 text-sm';
            containerCarta.classList.add('hidden');
            
            // Remove a barra de versões antiga se existir
            const velhaBarra = document.getElementById('areaVersoes');
            if(velhaBarra) velhaBarra.remove();

            try {
                const resposta = await fetch(`http://localhost:3000/cartas/busca/${nomePokemon}`);
                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagemErro.innerText = dados.erro || 'Carta não encontrada no multiverso.';
                    mensagemErro.className = 'text-red-500 font-bold mb-4 h-6 text-sm';
                    return;
                }

                listaCartasMultiverso = dados;

                // Cria a Barra de Versões Dinamicamente se houver mais de 1 carta!
                if (listaCartasMultiverso.length > 1) {
                    const areaVersoes = document.createElement('div');
                    areaVersoes.id = 'areaVersoes';
                    areaVersoes.className = 'flex flex-wrap gap-2 mb-4 p-3 bg-slate-900 rounded-lg border border-slate-700 justify-center w-full max-w-3xl';
                    
                    listaCartasMultiverso.forEach((carta, index) => {
                        const btn = document.createElement('button');
                        btn.innerText = `${carta.colecao} (${carta.numero})`;
                        btn.onclick = () => selecionarVersaoCarta(index);
                        areaVersoes.appendChild(btn);
                    });
                    
                    // Insere a barra de versões logo acima da carta
                    containerCarta.parentNode.insertBefore(areaVersoes, containerCarta);
                }

                // Carrega a Primeira Carta por Padrão
                selecionarVersaoCarta(0);

                mensagemErro.innerText = '';
                containerCarta.classList.remove('hidden');

            } catch (erro) {
                mensagemErro.innerText = 'Erro crítico: Servidor desligado?';
                mensagemErro.className = 'text-red-500 font-bold mb-4 h-6 text-sm';
            }
        }

        btnBuscar.addEventListener('click', acionarBusca);
        inputBusca.addEventListener('keypress', (e) => { if (e.key === 'Enter') acionarBusca(); });
    </script>
</body>
</html>
